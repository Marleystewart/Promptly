# Nightly source-health check. Probes every live ATS feed via the real
# aggregator; if any feed is broken (HTTP/network error), it opens (or updates)
# a GitHub issue so a dead source never rots silently. Runs on GitHub's
# runners — no secrets needed for the public feeds. Manual trigger available.
name: Source health

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Probe sources
        id: probe
        run: |
          set +e
          node scripts/probe-sources.js > probe-output.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat probe-output.txt

      - name: Open issue on failure
        if: steps.probe.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('probe-output.txt', 'utf8').slice(0, 60000);
            const title = 'Source health: one or more feeds are failing';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'source-health',
            });
            const marker = `\n\n<sub>Automated by source-health workflow.</sub>`;
            const fullBody = '```\n' + body + '\n```' + marker;
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString()}:\n\n${fullBody}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['source-health'], body: fullBody,
              });
            }
