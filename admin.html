<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Promptly · Founder Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0c0c16; color: #f1f0f7; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #9a97b5; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  input { flex: 1; min-width: 220px; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a2a40; background: #16162a; color: #fff; font-size: 15px; }
  button { padding: 12px 18px; border-radius: 12px; border: 0; background: #6d5efc; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: #16162a; border: 1px solid #25253c; border-radius: 16px; padding: 16px; }
  .card .n { font-size: 30px; font-weight: 800; }
  .card .l { color: #9a97b5; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: #c9c6e6; }
  table { width: 100%; border-collapse: collapse; background: #16162a; border-radius: 12px; overflow: hidden; }
  td, th { text-align: left; padding: 9px 12px; border-bottom: 1px solid #23233a; font-size: 14px; }
  th { color: #9a97b5; font-weight: 600; }
  .err { color: #ff8080; font-size: 14px; margin: 8px 0; }
  .muted { color: #9a97b5; }
</style>
</head>
<body>
  <h1>📊 Promptly — Founder Dashboard</h1>
  <div class="sub">Private. Enter your admin secret (the ADMIN_SECRET you set in Vercel).</div>
  <div class="row">
    <input id="secret" type="password" placeholder="Admin secret…" />
    <button id="load">Load</button>
  </div>
  <div id="err" class="err"></div>
  <div id="out"></div>

<script>
const $ = (id) => document.getElementById(id);
const saved = sessionStorage.getItem("promptlyAdminSecret");
if (saved) $("secret").value = saved;

function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[char]));
}

function table(title, rows, cols) {
  if (!rows || !rows.length) return `<h2>${escapeHtml(title)}</h2><p class="muted">No data yet.</p>`;
  const head = cols.map(c => `<th>${escapeHtml(c)}</th>`).join("");
  const body = rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c == null ? "-" : c)}</td>`).join("")}</tr>`).join("");
  return `<h2>${escapeHtml(title)}</h2><table><tr>${head}</tr>${body}</table>`;
}

async function load() {
  const secret = $("secret").value.trim();
  $("err").textContent = "";
  if (!secret) { $("err").textContent = "Enter your admin secret."; return; }
  sessionStorage.setItem("promptlyAdminSecret", secret);
  try {
    const r = await fetch("/api/admin-stats", { headers: { Authorization: `Bearer ${secret}` } });
    const d = await r.json();
    if (!r.ok) { $("err").textContent = d.error || "Failed."; $("out").innerHTML = ""; return; }
    const live = d.live || {};
    const eh = d.emailHealth;
    // Email either reaches real students or it does not. The sandbox sender
    // looks healthy from the inside — say so plainly instead.
    const emailBanner = !eh ? "" : `
      <div style="border:1px solid ${eh.canReachRealUsers ? "#1c7a52" : "#a3341f"};background:${eh.canReachRealUsers ? "#0f2a1f" : "#2c1512"};border-radius:10px;padding:14px 16px;margin:0 0 18px">
        <strong style="color:${eh.canReachRealUsers ? "#6fd3a3" : "#f0897c"}">
          ${eh.canReachRealUsers ? "Email can reach students" : "Email CANNOT reach students"}
        </strong>
        <div class="muted" style="margin-top:6px">Sending as ${escapeHtml(eh.from || "—")}</div>
        ${eh.blockedReason ? `<div style="margin-top:6px;color:#f0897c">${escapeHtml(eh.blockedReason)}</div>` : ""}
        ${eh.lastFailureAt ? `<div class="muted" style="margin-top:6px">Last failure (${escapeHtml(eh.lastFailureKind || "—")}) ${escapeHtml(eh.lastFailureAt)}: ${escapeHtml(eh.lastFailureReason || "—")}</div>` : ""}
        ${eh.lastSuccessAt ? `<div class="muted" style="margin-top:6px">Last successful send (${escapeHtml(eh.lastSuccessKind || "—")}) ${escapeHtml(eh.lastSuccessAt)}</div>` : `<div class="muted" style="margin-top:6px">No successful send recorded yet.</div>`}
      </div>`;
    // Where people drop. Each stage is a subset of the one above, so the gap
    // between two rows is a real number of people.
    const fn = d.funnel;
    const funnelPanel = !fn ? "" : (() => {
      const top = fn.stages[0].count || 0;
      const bars = fn.stages.map((st, i) => {
        const prev = i ? fn.stages[i - 1].count : st.count;
        const lost = prev - st.count;
        const width = top ? Math.max(2, Math.round((st.count / top) * 100)) : 2;
        return `
          <div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px">
              <span>${escapeHtml(st.label)}</span>
              <span><strong style="font-size:16px">${st.count}</strong> <span class="muted">${st.pct}%</span></span>
            </div>
            <div style="height:8px;border-radius:4px;background:#1b1e33;margin-top:4px;overflow:hidden">
              <div style="height:100%;width:${width}%;background:${i === fn.stages.length - 1 ? "#6fd3a3" : "#7c5cff"}"></div>
            </div>
            ${i && lost > 0 ? `<div class="muted" style="font-size:12px;margin-top:3px">&minus;${lost} lost here</div>` : ""}
          </div>`;
      }).join("");
      const s2 = fn.stuck;
      const todo = [
        s2.unconfirmed ? `${s2.unconfirmed} never confirmed their email${s2.unconfirmedExpiringSoon ? ` (${s2.unconfirmedExpiringSoon} deleted within 3 days)` : ""}` : "",
        s2.confirmedNeverAlerted ? `${s2.confirmedNeverAlerted} confirmed but have never been sent an alert` : "",
        s2.noFields ? `${s2.noFields} have no fields set, so they match EVERY listing, not none` : "",
        s2.alertsOff ? `${s2.alertsOff} have switched all alerts off` : "",
      ].filter(Boolean);
      return `
        <div style="border:1px solid #2a2f4a;background:#12142a;border-radius:10px;padding:16px 18px;margin:0 0 18px">
          <strong style="display:block;margin-bottom:14px">Signup funnel</strong>
          ${bars}
          ${todo.length ? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid #2a2f4a">
            ${todo.map(t => `<div class="muted" style="margin-bottom:4px">${escapeHtml(t)}</div>`).join("")}
          </div>` : ""}
          <div class="muted" style="font-size:12px;margin-top:12px">
            Exact account counts. App opens and posting clicks are anonymous daily
            counters and are reported separately &mdash; they are not part of this funnel.
          </div>
        </div>`;
    })();
    // Privacy housekeeping. These should be zero; a non-zero count means
    // something is still writing data we decided not to keep.
    const pc = d.privacyCleanup;
    const cleanupPanel = !pc ? "" : (() => {
      const det = pc.detail || {};
      const n = (v) => (v && typeof v === "object" ? (v.removed ?? v.scrubbed ?? 0) : (v || 0));
      const rows = [
        ["Legacy school keys removed", n(det.legacyOutcomes)],
        ["Profiles minimized", n(det.minimizedProfiles)],
        ["Coverage contacts scrubbed", n(det.coverage)],
        ["Expired reports pruned", n(det.reports)],
      ];
      const dirty = rows.some(([, v]) => v > 0);
      return `
        <div style="border:1px solid ${dirty ? "#7a5c1c" : "#2a2f4a"};background:${dirty ? "#241d0d" : "#12142a"};border-radius:10px;padding:14px 16px;margin:0 0 18px">
          <strong style="display:block;margin-bottom:8px">Privacy housekeeping</strong>
          ${rows.map(([label, v]) => `<div class="muted" style="margin-bottom:3px">${escapeHtml(label)}: <b style="color:${v > 0 ? "#e6a94f" : "#6fd3a3"}">${v}</b></div>`).join("")}
          <div class="muted" style="font-size:12px;margin-top:8px">
            Last run ${escapeHtml(pc.at || "—")}. Zero is the healthy state &mdash;
            a non-zero count means something is still writing data we have decided not to keep.
          </div>
        </div>`;
    })();
    // Did the scheduled jobs actually run? A cron failing nightly is
    // indistinguishable from a quiet week without this.
    const rh = d.runHealth;
    const runBanner = !rh ? "" : `
      <div style="border:1px solid ${rh.healthy ? "#1c7a52" : "#a3341f"};background:${rh.healthy ? "#0f2a1f" : "#2c1512"};border-radius:10px;padding:14px 16px;margin:0 0 18px">
        <strong style="color:${rh.healthy ? "#6fd3a3" : "#f0897c"}">
          ${rh.healthy ? "Scheduled jobs are running" : "Scheduled jobs need attention"}
        </strong>
        ${(rh.problems || []).map(p => `<div style="margin-top:6px;color:#f0897c">${escapeHtml(p)}</div>`).join("")}
        ${(rh.runs || []).map(run => {
          const detail = Object.entries(run.stats || {})
            .filter(([, v]) => typeof v === "number" && v > 0)
            .map(([k, v]) => `${escapeHtml(k)} ${v}`).join(", ");
          return `<div class="muted" style="margin-top:6px">${escapeHtml(run.name)} — ${
            run.everRan ? `${run.ageMinutes} min ago${run.ok ? "" : " (FAILED)"}${detail ? ` · ${detail}` : ""}` : "never run"
          }</div>`;
        }).join("")}
      </div>`;
    // Adapters that no-op without credentials look identical to "that source
    // had nothing today", so an unconfigured one can sit dead for weeks.
    const ih = d.integrationHealth;
    // "Set" is not "working" — a present-but-wrong key looks identical to a
    // quiet day from inside the app, so show what USAJOBS actually answered.
    const probe = ih && ih.usajobsProbe;
    const probeBanner = !probe || probe.ok ? "" : `
      <div style="border:1px solid #a3341f;background:#2c1512;border-radius:10px;padding:14px 16px;margin:0 0 18px">
        <strong style="color:#f0897c">USAJOBS credentials are set but NOT working</strong>
        <div class="muted" style="margin-top:6px">${escapeHtml(probe.reason || "")}${probe.status ? ` (HTTP ${probe.status})` : ""}</div>
        ${probe.shape ? `<div class="muted" style="margin-top:6px">key length ${probe.shape.keyLength}${probe.shape.keyLength !== 44 ? " — expected 44" : ""}${probe.shape.keyLooksLikeWholeLine ? " · value still contains \"USAJOBS_API_KEY=\" (paste grabbed the whole line)" : ""}${probe.shape.keyHasWhitespace ? " · has leading/trailing whitespace" : ""}${probe.shape.emailHasAt ? "" : " · email has no @"}</div>` : ""}
      </div>`;
    const okProbeBanner = probe && probe.ok ? `
      <div style="border:1px solid #1c7a52;background:#0f2a1f;border-radius:10px;padding:12px 16px;margin:0 0 18px">
        <strong style="color:#6fd3a3">USAJOBS credentials verified working</strong>
      </div>` : "";
    const integrationBanner = !ih || !(ih.unconfigured || []).length ? "" : `
      <div style="border:1px solid #a3341f;background:#2c1512;border-radius:10px;padding:14px 16px;margin:0 0 18px">
        <strong style="color:#f0897c">Data integration not configured: ${escapeHtml((ih.unconfigured || []).join(", "))}</strong>
        ${(ih.integrations || []).filter(i => !i.configured).map(i => `
          <div class="muted" style="margin-top:6px">${escapeHtml(i.name)} — covers ${escapeHtml(i.covers)}</div>
          <div style="margin-top:4px;color:#f0897c">${escapeHtml(i.blockedReason || "")}</div>
        `).join("")}
      </div>`;
    $("out").innerHTML = `
      ${funnelPanel}
      ${cleanupPanel}
      ${runBanner}
      ${emailBanner}
      ${integrationBanner}
      ${probeBanner}
      ${okProbeBanner}
      <div class="cards">
        <div class="card"><div class="n">${d.totalAccounts}</div><div class="l">Accounts</div></div>
        <div class="card"><div class="n">${d.withEmail}</div><div class="l">With email</div></div>
        <div class="card"><div class="n">${d.withEduEmail || 0}</div><div class="l">.edu verified</div></div>
        <div class="card"><div class="n">${d.withPush}</div><div class="l">Push enabled</div></div>
        <div class="card"><div class="n">${live.appOpensToday || 0}</div><div class="l">App opens today</div></div>
        <div class="card"><div class="n">${live.signupsToday || 0}</div><div class="l">Signups today</div></div>
        <div class="card"><div class="n">${live.applicationsToday || 0}</div><div class="l">Apps started today</div></div>
        <div class="card"><div class="n">${live.newListingsThisWeek || 0}</div><div class="l">New listings / wk</div></div>
        <div class="card"><div class="n">${d.watchedCount || 0}</div><div class="l">Companies watched</div></div>
        <div class="card"><div class="n">${d.coverageCount || 0}</div><div class="l">Coverage requests</div></div>
        <div class="card"><div class="n">${(d.verify && d.verify.flagged || []).length}</div><div class="l">Links flagged for review</div></div>
        <div class="card"><div class="n">${d.reportCount || 0}</div><div class="l">Student reports</div></div>
      </div>
      ${table("Accounts by school", d.bySchool, ["School", "#"])}
      ${table("By graduation year", d.byGradYear, ["Grad year", "#"])}
      ${table("By field interest", d.byField, ["Field", "#"])}
      ${table("Watched companies (live in pipeline)", (d.watched||[]).map(x => [x.company, x.ats, x.watchers]), ["Company", "Platform", "Watchers"])}
      ${table("Coverage requests (unsupported pages — demand signal)", (d.coverage||[]).map(x => [x.company || "—", x.url, x.requests]), ["Company", "URL", "Requests"])}
      ${d.verify ? `<p class="muted">Content check last ran ${escapeHtml(d.verify.checkedAt || "—")} · checked ${d.verify.checked || 0} of ${d.verify.totalLive || 0} live listings that run${(d.verify.summary && d.verify.summary.prioritisedByReports) ? ` · ${d.verify.summary.prioritisedByReports} pulled forward by student reports` : ""} · corroborating signal only, nothing here was auto-removed.</p>` : ""}
      ${table("⚠ Flagged for manual review (NOT removed — verify before acting)", (d.verify && d.verify.flagged || [])
        .slice()
        .sort((a, b) => (a.confidence === "red" ? 0 : 1) - (b.confidence === "red" ? 0 : 1))
        .map(x => [
          x.confidence === "red" ? "🔴 Likely dead" : x.confidence === "amber" ? "🟠 Needs a look" : "⚪ Unknown",
          x.company,
          x.role,
          x.reportCount || 0,
          x.confidenceReason || "—",
          x.sourceUrl,
        ]), ["State", "Company", "Role", "Reports", "Why", "Link"])}
      ${table("🚩 Reported by students (NOT removed — verify before acting)", (d.reports||[]).map(x => [
        x.company,
        x.role || "—",
        (x.reasons||[]).join(", "),
        (x.notes||[]).map(n => n.note).join(" · ") || "—",
        x.count,
        x.lastReportedAt ? new Date(x.lastReportedAt).toLocaleString() : "—",
      ]), ["Company", "Role", "Reason", "Notes", "Reports", "Last"])}
      ${table("Recent signups", (d.recent||[]).map(x => [x.email, x.school, x.gradYear, x.when ? new Date(x.when).toLocaleString() : "—"]), ["Email", "School", "Grad", "When"])}
      ${d.setupRequired ? `<p class="muted">${escapeHtml(d.setupRequired)}</p>` : ""}
    `;
  } catch (e) {
    $("err").textContent = "Network error: " + e.message;
  }
}
$("load").addEventListener("click", load);
$("secret").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
if (saved) load();
</script>
</body>
</html>
